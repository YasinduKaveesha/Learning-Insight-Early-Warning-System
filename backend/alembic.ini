# Component 3 Alembic configuration.
#
# This is a SEPARATE migration chain from the student app's
# (Upadya/Dev/backend/migrations/). Do not point it at that directory.
#
# The database URL is supplied at runtime from DATABASE_URL by migrations/env.py -- the
# value below is an inert placeholder so a bare `alembic` invocation without an
# environment fails loudly rather than touching a real database. env.py also refuses to
# run against the Supabase transaction pooler (port 6543 / `pooler` host).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@127.0.0.1:5432/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
